name: Setup
description: >-
  pnpm (the version in package.json "packageManager"), Node.js (the version in
  .nvmrc) with the pnpm store cached, and the locked dependencies. The install
  fails when pnpm-lock.yaml does not match package.json (dependency
  validation) or a release breaks the supply-chain policies in
  pnpm-workspace.yaml.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install locked dependencies
      shell: bash
      env:
        HUSKY: '0'
      run: pnpm install --frozen-lockfile
