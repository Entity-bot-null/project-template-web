name: Release

# Release management (docs/ci-cd.md#releases). release-please reads the
# Conventional Commits that reach main (the squashed pull request titles) and
# keeps one release pull request open: the next semantic version and the
# CHANGELOG.md entry. Merging it, after review and CI like any pull request,
# tags vX.Y.Z (immutable, .github/rulesets/tags.json), publishes the GitHub
# release with those notes and attaches the SBOM. Deploying a release is a
# separate, manual step (deploy.yml with the tag).
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release pull request and tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release branch, tags and releases
      pull-requests: write # the release pull request
      issues: write # its labels
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      # The release pull request this run opened or updated (JSON); empty
      # when it stayed as it was.
      pr: ${{ steps.release.outputs.pr }}
      own-token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Optional (docs/ci-cd.md#release-pull-requests): a GitHub App token
          # or a fine-grained token (contents, pull requests and issues:
          # write) opens the release pull request as that identity, so every
          # pull request workflow runs on it. Without it, the workflow's token
          # opens it, and the next job starts CI on it.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A pull request opened or updated with the workflow's token gets its
  # pull request runs only once someone approves them, and the ruleset
  # requires "CI passed" and "Conventions" on it. A dispatched run always
  # starts: each reports its check on the release branch's latest commit, the
  # one the pull request shows and the ruleset checks. Neither workflow holds
  # a secret, and the branch is main plus release-please's version and
  # changelog commit.
  release-pr-ci:
    name: CI on the release pull request
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' && needs.release-please.outputs.own-token != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # start CI and Conventions on the release branch
    steps:
      - name: Start CI and Conventions on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          [[ "$BRANCH" == release-please--* ]] || {
            echo "::error::Not a release-please branch: $BRANCH"
            exit 1
          }
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run conventions.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  # The SBOM in two jobs: the one that installs the dependencies (their
  # install scripts run) and runs the SBOM tool holds a read-only token; the
  # one that holds the write token checks out and installs nothing, so no
  # dependency code ever runs next to a token that can edit releases.
  sbom:
    name: Generate the SBOM
    needs: release-please
    if: ${{ needs.release-please.outputs.created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # CycloneDX, the npm packages the apps' production dependencies resolve
      # to in the lockfile, peer dependencies included. Not what an image adds
      # (operating system packages, Node.js, nginx), and bound to the tag, not
      # to an image: each pushed image carries its own SBOM and provenance
      # (docs/security.md#artifact-integrity).
      - run: pnpm sbom:generate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/sbom/sbom.cdx.json
          if-no-files-found: error
          retention-days: 1

  attach-sbom:
    name: Attach the SBOM
    needs: [release-please, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # upload the release asset
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom
      - name: Upload it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" sbom/sbom.cdx.json --clobber --repo "$GITHUB_REPOSITORY"
