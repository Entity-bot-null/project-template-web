name: CodeQL

# Static analysis for security issues (SAST). Opt-in: code scanning needs a
# public repository or GitHub Advanced Security. Enable it with the
# repository variable ENABLE_CODEQL=true (docs/security.md#static-analysis).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    if: vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # the code to analyze
      security-events: write # upload the results to code scanning
      actions: read # this run's details, which the upload reads in a private repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
