name: Deploy
run-name: Deploy ${{ inputs.ref }} to ${{ inputs.environment }}

# The integration point for deployments. It resolves the ref to a commit on
# main, re-runs every gate on that exact commit, then hands over to the
# protected GitHub environment (staging or production: required reviewers,
# environment secrets, main as the only deployment branch). One reference
# target ships ready: a Linux server with Docker (DEPLOY_TARGET=vps,
# docs/deploy-vps.md). For any other platform, the release job fails until it
# is implemented for it (docs/ci-cd.md#deployment). A rollback is a deployment
# of an earlier commit or release tag.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      ref:
        description: What to deploy, on main (branch, release tag or commit SHA)
        type: string
        required: true
        default: main

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve the commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # The checks below live in this file: a copy edited on another branch
      # could drop them, which is why the environments must also allow main
      # only (docs/ci-cd.md#deployment).
      - name: Refuse runs of the workflow from another branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error title=Wrong branch::Run Deploy from main; it deploys any commit on main."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only reviewed, merged code ships: the commit must be on main. Release
      # tags and earlier commits (rollbacks) of main qualify.
      - name: Resolve the ref to a commit on main
        id: resolve
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [[ ! "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "::error title=Invalid ref::Not a branch, tag or commit name: $REF"
            exit 1
          fi
          sha=$(git rev-parse --verify --quiet "$REF^{commit}" || git rev-parse --verify --quiet "origin/$REF^{commit}") || {
            echo "::error title=Unknown ref::$REF does not exist."
            exit 1
          }
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error title=Not on main::$REF ($sha) is not on main."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $REF = $sha" >> "$GITHUB_STEP_SUMMARY"

  gates:
    name: Gates
    needs: resolve
    uses: ./.github/workflows/quality-gates.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  # --- Reference target: one Linux server with Docker -------------------------
  # Opt in with the repository variable DEPLOY_TARGET=vps (docs/deploy-vps.md).
  # The images go to ghcr.io (IMAGE_PREFIX) once per commit; the server pulls
  # them by digest with this run's short-lived token, migrates, rolls out and
  # rolls back on its own (deploy/vps/deploy.sh).

  publish:
    name: Publish ${{ matrix.image }}
    needs: [resolve, gates]
    if: vars.DEPLOY_TARGET == 'vps'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io with this run's token
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
            target: runtime
          - image: api-migrate
            dockerfile: apps/api/Dockerfile
            target: migrate
          - image: web
            dockerfile: apps/web/Dockerfile
            target: runtime
    env:
      IMAGE: ${{ vars.IMAGE_PREFIX }}/${{ matrix.image }}:${{ needs.resolve.outputs.sha }}
      IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX }}
    steps:
      - name: The registry is ghcr.io
        run: |
          if [[ ! "$IMAGE_PREFIX" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+$ ]]; then
            echo "::error title=IMAGE_PREFIX::Set the repository variable IMAGE_PREFIX to ghcr.io/<owner>/<repository>, lowercase (docs/deploy-vps.md)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Staging published this commit already: production gets the very same
      # images (digests), never a rebuild.
      - name: Already published?
        id: existing
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE already published: reused."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      # Same context, target and build cache as the scanned build of the
      # gates: every layer is a cache hit.
      - name: Build and push
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          build-args: APP_RELEASE=${{ needs.resolve.outputs.sha }}
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

  release-vps:
    name: Release to ${{ inputs.environment }} (server)
    needs: [resolve, gates, publish]
    if: vars.DEPLOY_TARGET == 'vps'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read # read the digests; the server pulls with this token
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/app' }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Environment settings
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for name in DEPLOY_HOST PUBLIC_URL DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error title=$name::Set $name in the $TARGET_ENVIRONMENT environment (docs/deploy-vps.md)."
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      # The server runs its own copy of deploy/vps. A release whose copy differs
      # (a Caddy update from Dependabot, a fix to deploy.sh) stops here, before
      # anything changes on the server (docs/deploy-vps.md#update-the-server-files).
      - name: Check the server's deploy files
        run: |
          files=(compose.yaml Caddyfile realip.conf deploy.sh rollback.sh)
          expected=$(cd deploy/vps && sha256sum "${files[@]}")
          status=0
          actual=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && sha256sum ${files[*]}") || status=$?
          if [ "$status" -eq 255 ]; then
            echo "::error title=Server unreachable::Could not connect to $DEPLOY_HOST over SSH."
            exit 1
          fi
          if [ "$expected" != "$actual" ]; then
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            echo "::error title=Server files out of date::$DEPLOY_PATH differs from deploy/vps in this release: copy the files (docs/deploy-vps.md#update-the-server-files), then deploy again."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve the digests
        id: digests
        run: |
          for image in api api-migrate web; do
            digest=$(docker buildx imagetools inspect "$IMAGE_PREFIX/$image:$SHA" --format '{{json .Manifest}}' | jq -r '.digest')
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::No digest for $IMAGE_PREFIX/$image:$SHA"
              exit 1
            fi
            echo "${image//-/_}=$IMAGE_PREFIX/$image@$digest" >> "$GITHUB_OUTPUT"
            echo "$image: $IMAGE_PREFIX/$image@$digest" >> "$GITHUB_STEP_SUMMARY"
          done
      # deploy.sh records the running release, migrates, rolls out and goes
      # back by itself when the rollout fails. The token travels on stdin,
      # never on a command line.
      - name: Deploy on the server
        id: deploy
        env:
          API_REF: ${{ steps.digests.outputs.api }}
          MIGRATE_REF: ${{ steps.digests.outputs.api_migrate }}
          WEB_REF: ${{ steps.digests.outputs.web }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "REGISTRY_TOKEN=\$(cat) REGISTRY_USER='$GITHUB_ACTOR' '$DEPLOY_PATH/deploy.sh' '$API_REF' '$MIGRATE_REF' '$WEB_REF' '$SHA'"
      - name: Smoke test
        run: node scripts/smoke-test.mjs --url "$PUBLIC_URL" --release "$SHA"
      - name: Roll back
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "'$DEPLOY_PATH/rollback.sh'"
          echo "::error title=Rolled back::The smoke test failed: the previous release is running again."

  # --- Any other platform ------------------------------------------------------

  release:
    name: Release to ${{ inputs.environment }}
    needs: [resolve, gates]
    if: vars.DEPLOY_TARGET != 'vps'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      # Replace with the provider's steps, for needs.resolve.outputs.sha only
      # (never inputs.ref, which can move), in this order
      # (docs/ci-cd.md#deployment):
      #   1. images: push them once per commit (docker-images.yml with
      #      push: true); when <IMAGE_PREFIX>/api:<sha> already exists (pushed
      #      for staging), reuse it: production gets the digests staging
      #      verified, never a rebuild. Resolve each digest
      #      (docker buildx imagetools inspect <image>:<sha>) and deploy
      #      <image>@<digest> from here on;
      #   2. record the digests running before this deployment: they are the
      #      rollback target;
      #   3. run the api-migrate image against the environment's database; if
      #      it fails, stop: the running version keeps serving
      #      (docs/incident-response.md#10-failed-database-migration);
      #   4. roll out the api image, then the web image;
      #   5. smoke test: node scripts/smoke-test.mjs --url <public URL>
      #      --api <API URL inside the platform> --release <sha>;
      #   6. on failure, redeploy the digests recorded in step 2 (rollback).
      - name: Deployment is not configured
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          echo "::error title=Deployment not configured::Implement the release job for your infrastructure (docs/ci-cd.md#deployment). Commit: $SHA"
          exit 1
