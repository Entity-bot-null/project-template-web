# Weekly update pull requests; each one runs the full CI like any other.
# The seven-day cooldown matches the supply-chain delay in pnpm-workspace.yaml
# (minimumReleaseAge): a younger version would not install. Security updates
# (Dependabot alerts) are not delayed by the cooldown (docs/security.md#dependency-maintenance).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # @types/node describes the Node.js major of .nvmrc and moves with it, by
      # hand: a newer major types APIs the runtime does not have.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  # The workflows, and the composite action they share (.github/actions/setup):
  # '/' alone covers .github/workflows and a root action.yml only.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The Node.js major follows .nvmrc and engines, by hand, together with
      # the build: a major can drop what the images rely on (Node.js 25 no
      # longer bundles corepack, which installs pnpm here).
      - dependency-name: docker/library/node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build

  # The tool images CI runs (scripts/tool-images/Dockerfile): tag and digest
  # updated together. Outside .github/ on purpose: Dependabot may open pull
  # requests that change files there only for GitHub Actions, and refused
  # every one of these (dependabot/dependabot-core#15237).
  - package-ecosystem: docker
    directory: /scripts/tool-images
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # A PostgreSQL or Redis major moves by hand, with docker-compose.yml and,
      # for PostgreSQL, the managed database and its data
      # (docs/ci-cd.md#keeping-the-stack-current): CI tests the version that runs.
      - dependency-name: docker/library/postgres
        update-types: [version-update:semver-major]
      - dependency-name: docker/library/redis
        update-types: [version-update:semver-major]
      # The Ubuntu release of the cloud-init check is the servers' LTS: only
      # new digests of it. Dependabot reads an interim release (24.10, whose
      # archive closes when its nine months of support end) as a minor update
      # and the next LTS as a major one; the next LTS moves CI, the servers and
      # this image together, by hand (docs/ci-cd.md#ubuntu).
      - dependency-name: docker/library/ubuntu
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      tools:
        patterns: ['*']
    commit-message:
      prefix: ci

  # docker-compose.yml, and the reference server deployment's pinned images:
  # Caddy, PostgreSQL and Redis (deploy/vps/compose.yaml).
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy/vps
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Majors by hand, with the CI images above: a PostgreSQL data directory
      # (the development volume, and a server's that runs the database) does
      # not start under the next major; it is dumped and restored
      # (docs/ci-cd.md#postgresql-and-redis).
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build

  # The Terraform providers of infra/terraform/digitalocean: the exact version
  # in versions.tf and the checksums of .terraform.lock.hcl, for the platforms
  # the lock file already lists, updated together.
  - package-ecosystem: terraform
    directory: /infra/terraform/digitalocean
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
