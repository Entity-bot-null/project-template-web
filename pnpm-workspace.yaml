packages:
  - apps/*

# Fail the install on a Node.js version outside package.json "engines".
engineStrict: true

# Supply chain: a version must be public for seven days before it can be
# installed, so a hijacked release is usually caught and pulled before it
# reaches us. Dependabot waits as long (cooldown). pnpm re-checks every
# lockfile entry on each install.
#
# For an urgent security fix only, exempt the one fixed version with
# minimumReleaseAgeExclude: a block list, each entry an exact version with
# the date its exemption expires (at most seven days ahead: the version is
# old enough by then) and the advisory. `pnpm deps:check` fails on a bare
# name, a pattern, an entry without its date or written inline, and once the
# date has passed (docs/security.md#dependency-vulnerabilities):
#
#   minimumReleaseAgeExclude:
#     - 'vite@8.3.3' # expires 2026-10-16: GHSA-xxxx-xxxx-xxxx
#
# minimumReleaseAgeExcludePrune drops an entry once an update moves the
# lockfile past its version.
minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true
# Fixes of the advisories published on 2026-10-23, all four exempt until one
# date: the last of them turns seven days old on 2026-10-29 at 11:58 UTC, so
# on 2026-10-30 every one is old enough all day. Remove the four entries that
# day (docs/security.md#dependency-vulnerabilities).
minimumReleaseAgeExclude:
  - 'body-parser@2.4.0' # expires 2026-10-30: GHSA-27r3-jxmh-p828 (high), every JSON route of the API inflates compressed bodies
  - 'multer@2.5.0' # expires 2026-10-30: GHSA-q7qp-rjg7-q26m (high), in the API image (no route takes uploads)
  - 'nodemailer@10.1.4' # expires 2026-10-30: GHSA-8c8m-p3m8-cjg8, GHSA-m943-m63m-w62w, GHSA-85x2-q946-cp5h (moderate), the API's mail transport
  - 'fast-uri@3.1.9' # expires 2026-10-30: GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr (moderate), GHSA-xhq7-xmqj-769h, GHSA-333x-w4r6-6crp (low), astro check only

# Supply chain: a new version published with weaker evidence than its earlier
# ones (for example without the provenance or trusted publisher they had) is
# refused: the typical sign of a stolen maintainer token. Versions older than
# 30 days are not compared, since packages published before provenance
# existed would otherwise fail. Exempt a reviewed package with
# trustPolicyExclude.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200

# Supply chain: only the dependencies declared in a package.json may come from
# a git repository or a tarball URL; a transitive one doing so fails the
# install, since it bypasses the registry and its integrity checks.
blockExoticSubdeps: true

# Supply chain: dependencies may run install scripts only when listed here
# with true. pnpm stops the install when a new dependency wants to run one,
# so every addition is a reviewed decision.
allowBuilds:
  # Native password hashing binding.
  argon2: true
  # Prisma CLI and engines download their platform binaries.
  '@prisma/engines': true
  prisma: true
  # Telemetry only.
  '@scarf/scarf': false

# Optional dependencies that are never installed. sharp is the raster image
# optimizer Astro offers (apps/landing): the landing uses vector images only,
# with Astro's no-op image service (apps/landing/astro.config.mjs), and the
# libvips binaries sharp brings are LGPL-3.0-or-later, outside the license
# policy (scripts/dependency-policy.json).
ignoredOptionalDependencies:
  - sharp

# Security overrides: transitive versions forced past a published advisory
# until the dependency that pins them ships the fix, or, within the range a
# dependency accepts, because `pnpm update` moves direct dependencies only.
# Each entry names the advisory; delete it once `pnpm why <package>` shows a
# fixed version without the override (docs/security.md#dependency-vulnerabilities).
overrides:
  # GHSA-ggr8-5vv4-36mx (high), pinned at 7.1.5 by @prisma/config 7.10.
  '@prisma/config>deepmerge-ts': ^8.0.2
  # GHSA-3f6p-5ww8-9rcr (high) and GHSA-rgwj-5xj2-c3m3 (moderate), pinned at
  # 3.15.3 by the prisma CLI 7.10 (MySQL support; this template uses PostgreSQL).
  'prisma>mysql2': ^3.24.5
  # GHSA-q7qp-rjg7-q26m (high), pinned at 2.4.0 by @nestjs/platform-express
  # 12.1.3 (no route of this template takes uploads; it is in the image).
  '@nestjs/platform-express>multer': ^2.5.0
  # GHSA-27r3-jxmh-p828 (high), within express 5's ^2.2.1: every JSON route of
  # the API inflates compressed bodies.
  'express>body-parser': ^2.4.0
  # GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr (moderate) and two low ones,
  # within ajv's ^3.0.1 (astro check's YAML language server only).
  'ajv>fast-uri': ^3.1.9

# Reviewed peer exceptions: each entry says why the mismatch is safe.
peerDependencyRules:
  allowedVersions:
    # Declares TypeScript 5 but generates the same output under TypeScript 6
    # (the web typecheck verifies the generated file on every run).
    openapi-typescript>typescript: '6'
