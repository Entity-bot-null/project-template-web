# Mounted into the web image (compose.yaml): requests come from Caddy on the
# edge network, which sets X-Forwarded-For to the real client address. Only
# that network is trusted, so a client cannot choose its own address.
set_real_ip_from 172.30.0.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
