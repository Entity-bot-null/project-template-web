# Reference deployment on one Linux server with Docker (docs/deploy-vps.md):
# Caddy terminates TLS (automatic certificates) and forwards to the web image,
# which serves the app and forwards /api to the API. The database is a managed
# PostgreSQL outside this file (backups, point-in-time recovery).
#
# The images come from the registry by digest, written by deploy.sh into
# release.env (never edited by hand). Configuration comes from server.env
# (the domain) and api.env, migrate.env, web.env (the containers); none is
# committed: copy the .example files on the server and fill them in.
name: app

# Container logs rotate (Docker keeps them forever otherwise and they fill the
# disk): five files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

# Least privilege for every container (docs/security.md#container-images): no
# Linux capability, no privilege gained through a setuid binary, a read-only
# root filesystem (an intruder cannot change the code or plant a tool; only
# the tmpfs listed per service is writable, and it is gone at restart), and a
# bound on processes, so a runaway one cannot take the whole server down.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  pids_limit: 256

services:
  proxy:
    <<: *hardening
    logging: *logging
    # Tag for readers, digest for the server (Dependabot updates both).
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    # Ports 80 and 443 are privileged: the one capability Caddy keeps.
    cap_add: [NET_BIND_SERVICE]
    tmpfs: ['/tmp:size=16m']
    mem_limit: 256m
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in server.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]

  # Runs once per deployment (deploy.sh), before the rollout: prisma migrate
  # deploy with the migrator role. A profile keeps `up` from starting it.
  migrate:
    <<: *hardening
    logging: *logging
    image: ${MIGRATE_IMAGE:?set by deploy.sh}
    profiles: [migrate]
    tmpfs: ['/tmp:size=64m']
    mem_limit: 512m
    env_file: migrate.env
    networks: [edge]

  api:
    <<: *hardening
    logging: *logging
    image: ${API_IMAGE:?set by deploy.sh}
    restart: unless-stopped
    tmpfs: ['/tmp:size=64m']
    # Node.js sizes its heap from this limit.
    mem_limit: 1g
    env_file: api.env
    environment:
      NODE_ENV: production
      # One hop: the web image, which forwards the client address it got
      # from Caddy (realip.conf).
      TRUST_PROXY: '1'
    stop_grace_period: 30s
    networks: [edge]

  web:
    <<: *hardening
    logging: *logging
    image: ${WEB_IMAGE:?set by deploy.sh}
    restart: unless-stopped
    # nginx writes its configuration from the templates at start
    # (/etc/nginx/conf.d), and its pid and temporary files (/tmp), as user 101.
    tmpfs:
      - /tmp:size=32m,uid=101,gid=101
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101
    mem_limit: 256m
    env_file: web.env
    environment:
      API_UPSTREAM: http://api:3000
    volumes:
      # The client address comes from Caddy's X-Forwarded-For (the realip
      # module), not from the connection: otherwise every user would look
      # like the proxy to the API's rate limits and logs.
      - ./realip.conf:/etc/nginx/conf.d/realip.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

networks:
  edge:
    ipam:
      config:
        # Fixed, so realip.conf can trust exactly this network.
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
