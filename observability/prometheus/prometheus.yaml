# Prometheus configuration of the local backend (docker-compose.yml, service
# otel-lgtm, profile observability). It replaces the image's own
# /otel-lgtm/prometheus.yaml, because Prometheus reads rule files only from its
# configuration file: everything below `rule_files` is the image's file as
# shipped in grafana/otel-lgtm:0.34.0 (compare it when changing the image tag).
# Development only: a deployed Prometheus, Mimir or Grafana Cloud stack loads
# the same rule files its own way (docs/observability.md#dashboards-and-alerts-as-code).
global:
  scrape_native_histograms: true
  # How often the recording and alerting rules run. The API pushes its
  # metrics every OTEL_METRIC_EXPORT_INTERVAL (60 s by default).
  evaluation_interval: 30s

# Relative to this file: rules/ next to it, in the repository and in the
# container alike (promtool check config resolves them the same way).
rule_files:
  - rules/*.yaml

otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment # backward compatibility
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database # used by otelcol/receiver/mongodb
    - kafka.cluster.alias
storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m
