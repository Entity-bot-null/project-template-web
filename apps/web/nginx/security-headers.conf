# Included in every location that serves content: nginx drops the inherited
# add_header directives as soon as a location declares one of its own.
# The CSP allows this origin only: no inline scripts, no third parties. Widen
# it per directive, in review, when the app needs it (docs/security.md). The
# one exception: connect-src adds the error tracker's ingest origin when
# WEB_SENTRY_DSN is set ($error_tracking_origin, default.conf.template).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; connect-src 'self' $error_tracking_origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# No Referer from any page: pages are opened from one-time links (a password
# reset), and nothing here reads the header. The whole app, not a list of
# paths: the router matches paths in any letter case and percent-encoding.
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Strict-Transport-Security belongs to the TLS-terminating proxy in front of
# this container (docs/security.md#https).
